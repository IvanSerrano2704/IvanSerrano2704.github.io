<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        label, input{
            display: block;
            margin: 10px auto;
            text-align: center;
        }
    </style>
    <title>Formularios</title>
</head>
<body>
    <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" placeholder="Nombre" id="nombre" required>
        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" placeholder="Apellido" id="apellido" required>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="ejemplo@dominio.com" id="email" required>
        <label for="edad">Edad:</label>
        <input type="number" name="edad" placeholder="Edad" id="edad" min="0" max="120" required>
        <input type="date" name="fecha" id="fecha" required>
        <input type="color" name="color" id="color" required>
        <input type="checkbox" name="terminos" id="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
        <input type="submit" value="Enviar">
        <input type="reset" value="Restablecer">
        
    </form>
</body>
</html>
